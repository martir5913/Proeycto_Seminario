# ==============================================================================
# Configuración Nginx para Producción - UMG Villa Nueva (Presentaciones)
# Ubicación recomendada en el servidor: /etc/nginx/sites-available/umg-presentaciones
# ==============================================================================

# 1. Redirección HTTP (Puerto 80) a HTTPS (Puerto 443)
server {
    listen 80;
    listen [::]:80;
    server_name tu-dominio.umg.edu.gt; # Reemplazar por tu dominio o IP pública

    # Ruta para validación de certificados SSL de Let's Encrypt (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirección automática a HTTPS cuando el certificado esté activo
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor Seguro HTTPS (Puerto 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tu-dominio.umg.edu.gt; # Reemplazar por tu dominio

    # Certificados SSL (Gestionados automáticamente por Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/tu-dominio.umg.edu.gt/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tu-dominio.umg.edu.gt/privkey.pem;

    # Parámetros de Seguridad SSL Modernos
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Cabeceras de Seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Tamaño máximo de subida de archivos (PowerPoint PPTX, PDF, banners)
    client_max_body_size 60M;
    client_body_timeout 120s;

    # Compresión Gzip para optimizar ancho de banda en presentaciones
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Proxy hacia el contenedor de la aplicación Node.js
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Cabeceras de Proxy Inverso
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Tiempos de espera para renderizado de presentaciones pesadas
        proxy_connect_timeout 60s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    # Caché estática para diapositivas ya renderizadas y assets públicos
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080/uploads/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
