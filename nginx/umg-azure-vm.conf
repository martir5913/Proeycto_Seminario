# ========================================================
# Redireccion global HTTP (Puerto 80) a HTTPS seguro (443)
# ========================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name cms-umg2026.westus2.cloudapp.azure.com _;

    # Permitir renovaciones automaticas de Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirigir cualquier peticion HTTP a HTTPS permanente (301)
    location / {
        return 301 https://cms-umg2026.westus2.cloudapp.azure.com$request_uri;
    }
}

# ========================================================
# Servidor de Produccion HTTPS Seguro (Puerto 443 con SSL)
# ========================================================
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name cms-umg2026.westus2.cloudapp.azure.com;

    # Certificados SSL emitidos por Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/cms-umg2026.westus2.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms-umg2026.westus2.cloudapp.azure.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS (Strict-Transport-Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Limite para presentaciones grandes (.pptx, .pdf de hasta 60MB)
    client_max_body_size 60M;
    client_body_timeout 120s;

    # Compresion Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Proxy inverso hacia el contenedor Docker en 8080
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # Cache de 7 dias para banners y diapositivas estaticas
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080/uploads/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
