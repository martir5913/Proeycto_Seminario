version: '3.8'

services:
  umg-presentaciones:
    image: ghcr.io/martir5913/proeycto_seminario:latest
    container_name: umg_app_presentaciones
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./uploads_data:/app/backend/uploads
      - ./sqlite_data:/app/backend/data
      - ./logs_data:/app/backend/logs
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DB_PATH=/app/backend/data/database.sqlite
      - UPLOADS_DIR=/app/backend/uploads
      - LOGS_DIR=/app/backend/logs
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Proxy Inverso Nginx para gestión de HTTP/HTTPS, caché y subidas de archivos
  nginx:
    image: nginx:alpine
    container_name: umg_nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.docker.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - umg-presentaciones
