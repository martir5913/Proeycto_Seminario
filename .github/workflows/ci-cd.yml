name: CI/CD Pipeline - UMG Presentaciones (Git Flow)

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========================================================
  # 1. Integración Continua (Linting & Validaciones)
  # ========================================================
  test-and-lint:
    name: Validar Frontend y Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar y compilar Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Instalar dependencias del Backend
        run: |
          cd backend
          npm ci

  # ========================================================
  # 2. Empaquetado y Publicación de Contenedor Docker
  # ========================================================
  build-and-push:
    name: Construir y Publicar Imagen Docker
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticación en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos y etiquetas dinámicas de Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Si se publica en main o master (Producción)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=raw,value=production,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            # Si se publica en develop (Desarrollo / Staging)
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=dev-latest,enable=${{ github.ref == 'refs/heads/develop' }}
            # Etiquetas por SHA y versión semántica
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Construir y publicar imagen Docker optimizada (Debian Slim)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # 3. Despliegue Automatizado a Máquina Virtual de Azure
  # ========================================================
  deploy-production:
    name: Despliegue en Máquina Virtual Azure (SSH + Docker)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Validar configuración de secretos de Azure VM
        id: check_secrets
        run: |
          if [ -n "${{ secrets.AZURE_VM_HOST }}" ] && [ -n "${{ secrets.AZURE_VM_SSH_KEY }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "✅ Secretos de conexión con Azure VM detectados."
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ Secretos AZURE_VM_HOST o AZURE_VM_SSH_KEY no configurados en GitHub Secrets."
            echo "Para habilitar el despliegue automático continuo a la VM de Azure, consulte la guía: DEPLOY_AZURE_GITHUB_ACTIONS.md"
          fi

      - name: Desplegar en Azure VM vía SSH
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER || 'azureuser' }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: ${{ secrets.AZURE_VM_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Iniciando despliegue en VM de Azure..."
            APP_DIR="/opt/umg-presentaciones"
            sudo mkdir -p $APP_DIR
            sudo mkdir -p $APP_DIR/uploads_data $APP_DIR/sqlite_data $APP_DIR/logs_data
            sudo chown -R $USER:$USER $APP_DIR
            cd $APP_DIR

            # Autenticar con GHCR para descargar la imagen
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Descargar última versión de la imagen Docker
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Detener y remover contenedor previo si existe
            docker stop umg_app_presentaciones || true
            docker rm umg_app_presentaciones || true

            # Levantar contenedor en producción con volúmenes persistentes
            docker run -d \
              --name umg_app_presentaciones \
              --restart unless-stopped \
              -p 80:8080 \
              -v $APP_DIR/uploads_data:/app/backend/uploads \
              -v $APP_DIR/sqlite_data:/app/backend/data \
              -v $APP_DIR/logs_data:/app/backend/logs \
              -e NODE_ENV=production \
              -e PORT=8080 \
              -e DB_PATH=/app/backend/data/database.sqlite \
              -e UPLOADS_DIR=/app/backend/uploads \
              -e LOGS_DIR=/app/backend/logs \
              -e LOG_LEVEL=info \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Limpiar imágenes obsoletas para optimizar el almacenamiento del disco
            docker image prune -f

            echo "✅ Despliegue en Azure VM completado y en ejecución en puerto 80."
